<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2Б Расписание</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 6px 10px 8px;
            transition: background 0.5s, color 0.5s;
            background: #f0f9ff;
            color: #1e293b;
            position: relative;
            overflow: hidden;
            height: 100vh;
        }
        body.light { background: linear-gradient(180deg, #bae6fd 0%, #f0f9ff 50%, #ffffff 100%); }
        body.light::before {
            content: '☀️';
            position: fixed;
            top: 4px; right: 12px;
            font-size: 2.8rem;
            filter: drop-shadow(0 0 30px #fbbf24);
            animation: spin 20s linear infinite;
            z-index: 0; opacity: 0.5; pointer-events: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(12deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .cloud {
            position: fixed;
            font-size: 2.5rem;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            animation: floatCloud 25s ease-in-out infinite alternate;
        }
        .cloud1 { top: 4%; left: -8%; animation-duration: 28s; }
        .cloud2 { top: 14%; right: -6%; animation-duration: 32s; animation-delay: 3s; }
        .cloud3 { bottom: 18%; left: 2%; animation-duration: 35s; animation-delay: 6s; font-size: 3rem; }
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(70px); }
        }
        body.dark {
            background: linear-gradient(180deg, #0b0f1a 0%, #1a1a3e 50%, #0f172a 100%);
            color: #f1f5f9;
        }
        body.dark::before {
            content: '🌙';
            position: fixed;
            top: 6px; right: 14px;
            font-size: 2.8rem;
            filter: drop-shadow(0 0 30px #fbbf24);
            z-index: 0; opacity: 0.5; pointer-events: none;
            animation: moonGlow 4s ease-in-out infinite alternate;
        }
        @keyframes moonGlow {
            0% { filter: drop-shadow(0 0 20px #fbbf24); opacity: 0.4; }
            100% { filter: drop-shadow(0 0 50px #fbbf24); opacity: 0.8; }
        }
        body.dark .cloud { display: none; }
        .star {
            position: fixed;
            color: #fbbf24;
            font-size: 1rem;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        .star:nth-child(1) { top: 4%; left: 6%; animation-delay: 0.2s; font-size: 1.4rem; }
        .star:nth-child(2) { top: 10%; left: 22%; animation-delay: 0.8s; }
        .star:nth-child(3) { top: 3%; left: 42%; animation-delay: 1.4s; font-size: 1.6rem; }
        .star:nth-child(4) { top: 18%; right: 12%; animation-delay: 0.5s; }
        .star:nth-child(5) { bottom: 20%; left: 10%; animation-delay: 1.1s; font-size: 1.4rem; }
        .star:nth-child(6) { bottom: 10%; right: 6%; animation-delay: 1.7s; }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
        .control-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        .control-btn {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 30px;
            padding: 3px 10px;
            font-size: 0.6rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        body.dark .control-btn {
            background: rgba(255,255,255,0.08);
            color: #f1f5f9;
        }
        .control-btn:hover { transform: scale(1.03); }
        .control-btn:active { transform: scale(0.94); }
        .header {
            text-align: center;
            padding: 2px 0 2px;
            border-bottom: 2px dashed #fbbf24;
            margin-bottom: 3px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #f97316, #eab308, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        body.dark .header h1 {
            background: linear-gradient(45deg, #38bdf8, #fbbf24, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .sub {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 1px;
        }
        .header .sub .badge {
            font-size: 0.5rem;
            font-weight: 700;
            padding: 1px 10px;
            border-radius: 30px;
            background: #f43f5e;
            color: #fff;
            box-shadow: 0 2px 12px rgba(244, 63, 94, 0.3);
        }
        .header .sub .count {
            font-size: 0.5rem;
            font-weight: 600;
            color: #64748b;
            background: rgba(255,255,255,0.5);
            padding: 1px 10px;
            border-radius: 30px;
        }
        body.dark .header .sub .count {
            background: rgba(255,255,255,0.06);
            color: #94a3b8;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            font-size: 0.5rem;
            font-weight: 600;
        }
        .info-panel .weather, .info-panel .timer {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(4px);
            padding: 2px 8px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        body.dark .info-panel .weather,
        body.dark .info-panel .timer {
            background: rgba(255,255,255,0.06);
            color: #cbd5e1;
        }
        .info-panel .timer .time {
            font-weight: 800;
            color: #f43f5e;
        }
        body.dark .info-panel .timer .time { color: #f87171; }
        .day-tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 1px 0 4px;
            scrollbar-width: none;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        .day-tabs::-webkit-scrollbar { display: none; }
        .day-btn {
            flex: 0 0 auto;
            padding: 3px 8px;
            border-radius: 30px;
            border: none;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            color: #475569;
            font-size: 0.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        body.dark .day-btn {
            background: #1e293b;
            color: #94a3b8;
        }
        .day-btn.active {
            background: #fbbf24;
            color: #0f172a;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            border: 2px solid #fbbf24;
        }
        body.dark .day-btn.active {
            background: #fbbf24;
            color: #0f172a;
            border: 2px solid #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.6);
        }
        .day-btn:active { transform: scale(0.94); }
        #scheduleContainer {
            flex: 1 1 auto;
            overflow-y: auto;
            position: relative;
            z-index: 2;
            min-height: 0;
            padding: 2px 0;
        }
        .schedule-card { display: block; }

        /* --- УРОКИ (компактная версия) --- */
        .lesson-item {
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #fbbf24;
            transition: 0.2s;
            cursor: pointer;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            min-height: 36px;
        }
        body.dark .lesson-item {
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .lesson-item:active { transform: scale(0.97); }

        /* Обед */
        .lesson-item.lunch {
            border-left-color: #f59e0b !important;
            border: 2px solid #f59e0b;
            background: rgba(251, 191, 36, 0.15);
            animation: lunchWobble 1.5s ease-in-out infinite;
            cursor: default;
        }
        body.dark .lesson-item.lunch {
            background: rgba(251, 191, 36, 0.2);
        }
        @keyframes lunchWobble {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.01) rotate(-0.5deg); }
            75% { transform: scale(1.01) rotate(0.5deg); }
        }
        .lesson-item.lunch .lesson-icon {
            animation: lunchIcon 2s ease-in-out infinite;
        }
        @keyframes lunchIcon {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .lesson-item.current-lesson {
            border-left-color: #22c55e !important;
            border: 2px solid #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }
        body.dark .lesson-item.current-lesson {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
        }
        .lesson-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #22c55e;
            transition: width 0.5s linear;
            border-radius: 0 2px 0 0;
        }
        body.dark .lesson-progress {
            background: #4ade80;
        }
        .lesson-item.lunch .lesson-progress {
            background: #f59e0b;
        }

        .lesson-number {
            background: #e2e8f0;
            color: #475569;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.55rem;
            flex-shrink: 0;
        }
        body.dark .lesson-number {
            background: #334155;
            color: #cbd5e1;
        }
        .lesson-icon { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
        .lesson-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .lesson-name {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .lesson-sub {
            font-size: 0.5rem;
            color: #94a3b8;
            margin-top: 1px;
            font-weight: 500;
        }
        .lesson-time {
            font-size: 0.55rem;
            font-weight: 600;
            color: #64748b;
            background: rgba(0,0,0,0.05);
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        body.dark .lesson-time {
            color: #94a3b8;
            background: rgba(255,255,255,0.05);
        }

        /* Разделитель до/после обеда */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0 4px;
            color: #94a3b8;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-divider::before, .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #cbd5e1;
        }
        body.dark .section-divider {
            color: #64748b;
        }
        body.dark .section-divider::before,
        body.dark .section-divider::after {
            background: #334155;
        }

        /* --- НИЖНИЙ БЛОК --- */
        .bottom-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        .tooltip-box {
            border-radius: 8px;
            padding: 4px 10px;
            border-left: 4px solid #f43f5e;
            font-size: 0.6rem;
            line-height: 1.3;
            min-height: 28px;
            transition: 0.3s;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(6px);
            color: #1e293b;
            box-shadow: 0 1px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        body.dark .tooltip-box {
            background: rgba(30, 41, 59, 0.9);
            color: #cbd5e1;
            box-shadow: 0 1px 6px rgba(0,0,0,0.2);
        }
        .tooltip-box .icon { font-size: 0.8rem; flex-shrink: 0; }
        .tooltip-box .text { flex: 1; }
        .tooltip-box .text strong { color: #fbbf24; }

        .bottom-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .bottom-actions .action-btn {
            flex: 1;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 30px;
            padding: 3px 8px;
            font-size: 0.5rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }
        body.dark .bottom-actions .action-btn {
            background: rgba(255,255,255,0.06);
            color: #f1f5f9;
        }
        .bottom-actions .action-btn:active { transform: scale(0.94); }
        .math { border-color: #f87171; }
        .rus { border-color: #60a5fa; }
        .lit { border-color: #fbbf24; }
        .eng { border-color: #34d399; }
        .world { border-color: #6ee7b7; }
        .phys { border-color: #f472b6; }
        .music { border-color: #a78bfa; }
        .izo { border-color: #f472b6; }
        .tech { border-color: #fb923c; }
        .sense { border-color: #22d3ee; }
        .talk { border-color: #f87171; }
        .extra { border-color: #fbbf24; }
        .circle { border-color: #e879f9; }
        body.dark .math { border-color: #f87171; }
        body.dark .rus { border-color: #60a5fa; }
        body.dark .lit { border-color: #fbbf24; }
        body.dark .eng { border-color: #34d399; }
        body.dark .world { border-color: #6ee7b7; }
        body.dark .phys { border-color: #f472b6; }
        body.dark .music { border-color: #a78bfa; }
        body.dark .izo { border-color: #f472b6; }
        body.dark .tech { border-color: #fb923c; }
        body.dark .sense { border-color: #22d3ee; }
        body.dark .talk { border-color: #f87171; }
        body.dark .extra { border-color: #fbbf24; }
        body.dark .circle { border-color: #e879f9; }
        #scheduleContainer::-webkit-scrollbar { width: 0; }
        .pull-indicator {
            text-align: center;
            font-size: 0.5rem;
            color: #94a3b8;
            padding: 1px 0;
            opacity: 0;
            transition: opacity 0.3s;
            position: relative;
            z-index: 2;
            height: 14px;
        }
        .pull-indicator.show { opacity: 1; }
        @media print {
            .no-print { display: none !important; }
            body { background: #fff !important; color: #000 !important; overflow: visible !important; height: auto !important; }
            .lesson-item { background: #f8fafc !important; border: 1px solid #ddd !important; }
            .tooltip-box { background: #f1f5f9 !important; border: 1px solid #ccc !important; }
            .header h1 { -webkit-text-fill-color: #000 !important; background: none !important; color: #000 !important; }
        }
    </style>
</head>
<body class="light">

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>
    <div class="star">✦</div>
    <div class="star">✦</div>
    <div class="star">✦</div>
    <div class="star">✦</div>
    <div class="star">✦</div>
    <div class="star">✦</div>

    <div class="control-bar">
        <button class="control-btn" id="themeToggle">🌙 Тёмная</button>
        <button class="control-btn" id="fullscreenToggle">⛶ На весь</button>
        <button class="control-btn" id="exportPdf">📄 PDF</button>
    </div>

    <div class="header">
        <h1>🌟 2Б РАСПИСАНИЕ</h1>
        <div class="sub">
            <span class="badge" id="todayBadge">📅 СЕГОДНЯ</span>
            <span class="count" id="lessonCount">📚 0 уроков</span>
        </div>
    </div>

    <div class="info-panel">
        <div class="weather" id="weatherDisplay">🌤️ Тюмень: загрузка...</div>
        <div class="timer" id="timerDisplay">⏱️ До звонка: <span class="time" id="timerValue">--:--</span></div>
    </div>

    <div class="pull-indicator" id="pullIndicator">⬇️ Потяни, чтобы обновить</div>

    <div class="day-tabs" id="dayTabs">
        <button class="day-btn active" data-day="0">ПН</button>
        <button class="day-btn" data-day="1">ВТ</button>
        <button class="day-btn" data-day="2">СР</button>
        <button class="day-btn" data-day="3">ЧТ</button>
        <button class="day-btn" data-day="4">ПТ</button>
        <button class="day-btn" data-day="5">СБ 🎉</button>
        <button class="day-btn" data-day="6">ВС 😴</button>
    </div>

    <div id="scheduleContainer"></div>

    <div class="bottom-block">
        <div class="tooltip-box" id="tooltip">
            <span class="icon">👆</span>
            <span class="text">Нажми на урок — узнаешь секрет!</span>
        </div>
        <div class="bottom-actions">
            <button class="action-btn" id="shareBtn"><span>📤</span> Поделиться</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ДАННЫЕ
        // ============================================================
        const days = [{
            name: 'ПОНЕДЕЛЬНИК',
            isWeekend: false,
            lessons: [
                { name: 'Занимательная математика (кружок)', icon: '🧮', cls: 'circle', tip: 'Играем в числа! Будет весело, как в квесте.' },
                { name: 'Разговоры о важном', icon: '🗣️', cls: 'talk', tip: 'Говорим о дружбе и мечтах. Можно даже пофантазировать!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Чертим фигуры и считаем. Ты сможешь!' },
                { name: 'Английский язык', icon: '🇬🇧', cls: 'eng', tip: 'Новые слова! Повторяй за учителем — будет классно.' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Пишем красиво и грамотно. Ты почти писатель!' },
                { name: 'Музыка', icon: '🎵', cls: 'music', tip: 'Поём и танцуем! Даже если не в ритм — главное радость.' }
            ]
        }, {
            name: 'ВТОРНИК',
            isWeekend: false,
            lessons: [
                { name: 'Физическая культура', icon: '🏃', cls: 'phys', tip: 'Бегай, прыгай, играй! Не забудь воду и форму.' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Читаем сказки. Представь, что ты герой книги!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Учим таблицу умножения. Это как магия чисел!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Разбираем слова. Ты уже почти эксперт!' },
                { name: 'Окружающий мир', icon: '🌍', cls: 'world', tip: 'Узнаём о животных. Кто живёт в лесу?' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Решаем сложные задачки. Ты же умник!' }
            ]
        }, {
            name: 'СРЕДА',
            isWeekend: false,
            lessons: [
                { name: 'Английский язык', icon: '🇬🇧', cls: 'eng', tip: 'Учим слова про еду и игры. Yummy!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Ищем неизвестное, как сыщики.' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Падежи — не страшно. Повторим и запомним.' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Читаем стихи. Попробуй прочитать с выражением!' },
                { name: 'ИЗО', icon: '🎨', cls: 'izo', tip: 'Рисуй что хочешь. Даже если не похоже — это искусство!' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Логические задачки — для настоящих гениев.' }
            ]
        }, {
            name: 'ЧЕТВЕРГ',
            isWeekend: false,
            lessons: [
                { name: 'Окружающий мир', icon: '🌍', cls: 'world', tip: 'Планета Земля — наш дом. Береги её!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Сочиняем историю. Кто твой главный герой?' },
                { name: 'Физическая культура', icon: '🏃', cls: 'phys', tip: 'Спортивные игры — лови мяч и беги!' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Сказки разных народов. Узнай новое!' },
                { name: 'Технология', icon: '🔧', cls: 'tech', tip: 'Лепим, клеим, мастерим. Твори как художник!' }
            ]
        }, {
            name: 'ПЯТНИЦА',
            isWeekend: false,
            lessons: [
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Дочитываем книгу до конца. Как тебе финал?' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Решай спокойно. Ты всё знаешь!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Глаголы — наши друзья. Пиши уверенно.' },
                { name: 'Смысловое чтение', icon: '🤔', cls: 'sense', tip: 'Читай и думай. Задавай вопросы — это круто!' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Финальная битва с задачками. Ты победишь!' }
            ]
        }, {
            name: 'СУББОТА 🎉',
            isWeekend: true,
            lessons: []
        }, {
            name: 'ВОСКРЕСЕНЬЕ 😴',
            isWeekend: true,
            lessons: []
        }];

        // ============================================================
        // 2. ПОДСКАЗКИ
        // ============================================================
        const tipMap = {};
        days.forEach((day, dayIdx) => {
            day.lessons.forEach((lesson, lessonIdx) => {
                tipMap[dayIdx + '-' + lessonIdx] = lesson.tip;
            });
        });

        // ============================================================
        // 3. РАСПИСАНИЕ ЗВОНКОВ
        // ============================================================
        const bellSchedule = [
            { start: '13:30', end: '14:10', type: 'lesson' },
            { start: '14:20', end: '15:00', type: 'lesson' },
            { start: '15:20', end: '16:00', type: 'lesson' },
            { start: '16:00', end: '16:20', type: 'lunch' },
            { start: '16:20', end: '17:00', type: 'lesson' },
            { start: '17:10', end: '17:50', type: 'lesson' },
            { start: '18:00', end: '18:40', type: 'lesson' },
        ];

        // ============================================================
        // 4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function getTodayIndex() {
            const today = new Date().getDay();
            const weekdays = [1,2,3,4,5,6,0];
            let idx = weekdays.indexOf(today);
            // Если сегодня суббота (6) или воскресенье (0) — показываем их
            // но по умолчанию для субботы и воскресенья показываем соответствующие дни
            return idx;
        }

        function getCurrentLessonIndex() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            const timeStr = h + ':' + m;
            let currentIdx = -1;
            let nextIdx = -1;
            for (let i = 0; i < bellSchedule.length; i++) {
                const s = bellSchedule[i].start;
                const e = bellSchedule[i].end;
                if (timeStr >= s && timeStr < e) {
                    currentIdx = i;
                    nextIdx = (i + 1 < bellSchedule.length) ? i + 1 : -1;
                    break;
                }
                if (timeStr < s) {
                    nextIdx = i;
                    break;
                }
            }
            return { currentIdx, nextIdx };
        }

        function getTimeDiff(targetTimeStr, now) {
            const parts = targetTimeStr.split(':');
            const target = new Date(now);
            target.setHours(parseInt(parts[0]), parseInt(parts[1]), 0);
            return (target - now) / 1000;
        }

        function formatTimeSmart(seconds) {
            if (seconds < 0) seconds = 0;
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            let parts = [];
            if (days > 0) parts.push(days + 'д');
            if (hours > 0 || days > 0) parts.push(String(hours).padStart(2, '0') + 'ч');
            if (minutes > 0 || hours > 0 || days > 0) parts.push(String(minutes).padStart(2, '0') + 'м');
            parts.push(String(secs).padStart(2, '0') + 'с');

            return parts.join(' ');
        }

        // ============================================================
        // 5. ГЛАВНАЯ ФУНКЦИЯ ОБНОВЛЕНИЯ
        // ============================================================
        const container = document.getElementById('scheduleContainer');
        const lessonCountEl = document.getElementById('lessonCount');
        const timerEl = document.getElementById('timerValue');
        const timerDisplay = document.getElementById('timerDisplay');

        let currentDay = 0;
        let renderedDay = -1;

        function renderSchedule() {
            const dayIndex = currentDay;
            const day = days[dayIndex];
            const { currentIdx, nextIdx } = getCurrentLessonIndex();
            const now = new Date();
            const isToday = (dayIndex === getTodayIndex());

            // --- ОБНОВЛЯЕМ ТАЙМЕР (СВЕРХУ) ---
            if (!day.isWeekend && currentIdx !== -1) {
                const endTime = bellSchedule[currentIdx].end;
                const diff = getTimeDiff(endTime, now);
                if (diff > 0) {
                    timerEl.textContent = formatTimeSmart(diff);
                    timerEl.style.color = '#f43f5e';
                    timerDisplay.innerHTML = `⏱️ До звонка: <span class="time" style="color:#f43f5e">${timerEl.textContent}</span>`;
                } else {
                    timerEl.textContent = '0с';
                    timerEl.style.color = '#f43f5e';
                    timerDisplay.innerHTML = `⏱️ До звонка: <span class="time" style="color:#f43f5e">0с</span>`;
                }
            } else if (!day.isWeekend && nextIdx !== -1) {
                const startTime = bellSchedule[nextIdx].start;
                const diff = getTimeDiff(startTime, now);
                if (diff > 0) {
                    timerEl.textContent = formatTimeSmart(diff);
                    timerEl.style.color = '#34d399';
                    timerDisplay.innerHTML = `⏱️ До урока: <span class="time" style="color:#34d399">${timerEl.textContent}</span>`;
                } else {
                    timerEl.textContent = '0с';
                    timerEl.style.color = '#34d399';
                    timerDisplay.innerHTML = `⏱️ До урока: <span class="time" style="color:#34d399">0с</span>`;
                }
            } else if (day.isWeekend) {
                timerEl.textContent = '🎉';
                timerEl.style.color = '#94a3b8';
                timerDisplay.innerHTML = `⏱️ Выходные! <span class="time" style="color:#94a3b8">🎉</span>`;
            } else {
                timerEl.textContent = '🎉';
                timerEl.style.color = '#94a3b8';
                timerDisplay.innerHTML = `⏱️ Уроки закончились! <span class="time" style="color:#94a3b8">🎉</span>`;
            }

            // --- ОБНОВЛЯЕМ РАСПИСАНИЕ ---
            if (dayIndex === renderedDay && !day.isWeekend) {
                updateDynamicElements(currentIdx, now);
                return;
            }

            renderedDay = dayIndex;

            // --- ВЫХОДНЫЕ ---
            if (day.isWeekend) {
                const weekendData = getWeekendData(dayIndex);
                container.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 20px; animation: weekendPulse 2s ease-in-out infinite;">
                        <div style="font-size: 5rem; text-align: center;">${weekendData.emoji}</div>
                        <div style="font-size: 1.8rem; font-weight: 900; text-align: center; background: linear-gradient(45deg, #f97316, #eab308); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${weekendData.title}</div>
                        <div style="font-size: 1.2rem; text-align: center; color: #64748b; max-width: 300px;">${weekendData.sub}</div>
                    </div>
                    <style>
                        @keyframes weekendPulse {
                            0%, 100% { transform: scale(1); }
                            50% { transform: scale(1.02); }
                        }
                    </style>
                `;
                lessonCountEl.textContent = '🎉 ВЫХОДНЫЕ!';
                return;
            }

            // --- БУДНИ ---
            let html = '';

            // --- СЕЙЧАС ПЕРЕМЕНА ИЛИ ОБЕД ---
            if (currentIdx === -1 && nextIdx !== -1 && isToday) {
                const nextLesson = bellSchedule[nextIdx];
                const timeLeft = getTimeDiff(nextLesson.start, now);
                const isLunch = nextLesson.type === 'lunch';
                const icon = isLunch ? '🍔' : '⌛';
                const title = isLunch ? 'Обед!' : 'Перемена';
                const sub = isLunch ? 'Вкуснятина!' : `Следующий урок через ${formatTimeSmart(timeLeft)}`;
                html += `
                    <div class="lesson-item current-lesson ${isLunch ? 'lunch' : ''}" style="border-left-color: ${isLunch ? '#f59e0b' : '#22c55e'} !important; border-color: ${isLunch ? '#f59e0b' : '#22c55e'} !important;">
                        <div class="lesson-icon">${icon}</div>
                        <div class="lesson-info">
                            <div class="lesson-name">${title}</div>
                            <div class="lesson-sub">${sub}</div>
                        </div>
                        <div class="lesson-time">${isLunch ? '🍽️' : '⏳'} ${formatTimeSmart(timeLeft)}</div>
                    </div>
                `;
            }

            // --- РИСУЕМ УРОКИ С РАЗДЕЛЕНИЕМ ДО/ПОСЛЕ ОБЕДА ---
            let lessonIndex = 0;
            const beforeLunchLessons = [];
            const afterLunchLessons = [];

            for (let i = 0; i < bellSchedule.length; i++) {
                const slot = bellSchedule[i];
                if (slot.type === 'lunch') continue;
                if (lessonIndex >= day.lessons.length) break;
                const lesson = day.lessons[lessonIndex];
                lessonIndex++;
                if (i < 3) {
                    beforeLunchLessons.push({ slot, lesson, index: i });
                } else {
                    afterLunchLessons.push({ slot, lesson, index: i });
                }
            }

            lessonIndex = 0;

            // --- ДО ОБЕДА ---
            if (beforeLunchLessons.length > 0) {
                html += `<div class="section-divider">🍳 До обеда</div>`;
                for (const item of beforeLunchLessons) {
                    html += renderLesson(item.lesson, item.slot, item.index, dayIndex, lessonIndex, currentIdx, now, isToday);
                    lessonIndex++;
                }
            }

            // --- ОБЕД ---
            const lunchSlot = bellSchedule.find(s => s.type === 'lunch');
            if (lunchSlot) {
                const isCurrent = (isToday && bellSchedule.indexOf(lunchSlot) === currentIdx);
                const isNext = (isToday && bellSchedule.indexOf(lunchSlot) === nextIdx);
                const timeRange = `${lunchSlot.start} – ${lunchSlot.end}`;

                let progress = 0;
                let timeLeftStr = '';
                if (isCurrent) {
                    const total = getTimeDiff(lunchSlot.end, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0)) -
                                 getTimeDiff(lunchSlot.start, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0));
                    const elapsed = getTimeDiff(lunchSlot.start, now);
                    if (total > 0) {
                        progress = Math.min((elapsed / total) * 100, 100);
                    }
                    const left = getTimeDiff(lunchSlot.end, now);
                    if (left > 0) {
                        timeLeftStr = formatTimeSmart(left);
                    }
                }

                const currentClass = isCurrent ? 'current-lesson lunch' : '';
                const progressBar = isCurrent ? `<div class="lesson-progress" style="width: ${progress}%;"></div>` : '';

                html += `
                    <div class="section-divider">🍔 Обед</div>
                    <div class="lesson-item lunch ${currentClass}" style="${isCurrent ? 'border-color: #f59e0b !important;' : ''}">
                        ${progressBar}
                        <div class="lesson-number">🍔</div>
                        <div class="lesson-icon">🍽️</div>
                        <div class="lesson-info">
                            <div class="lesson-name">🍔 Обед! Вкуснятина!</div>
                            <div class="lesson-sub">${isCurrent ? 'Едим и отдыхаем' : 'Время обеда'}</div>
                        </div>
                        <div class="lesson-time">${isCurrent ? `⏳ ${timeLeftStr}` : timeRange}</div>
                    </div>
                `;
            }

            // --- ПОСЛЕ ОБЕДА ---
            if (afterLunchLessons.length > 0) {
                html += `<div class="section-divider">🌙 После обеда</div>`;
                for (const item of afterLunchLessons) {
                    html += renderLesson(item.lesson, item.slot, item.index, dayIndex, lessonIndex, currentIdx, now, isToday);
                    lessonIndex++;
                }
            }

            container.innerHTML = html;

            const totalLessons = day.lessons.length;
            lessonCountEl.textContent = `📚 ${totalLessons} уроков`;

            // --- КЛИК ПО УРОКУ ---
            document.querySelectorAll('.lesson-item:not(.lunch)').forEach(el => {
                el.addEventListener('click', function() {
                    const dayIdx = parseInt(this.dataset.day);
                    const lessonIdx = parseInt(this.dataset.lessonIndex);
                    const tip = days[dayIdx].lessons[lessonIdx].tip || 'Будь молодцом!';
                    const name = days[dayIdx].lessons[lessonIdx].name;
                    document.querySelector('.tooltip-box .text').innerHTML =
                        `<strong>${name}</strong> — ${tip}`;
                    document.querySelector('.tooltip-box .icon').textContent = '💡';
                });
            });
        }

        // ============================================================
        // 6. ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ ДЛЯ ОТРИСОВКИ УРОКА
        // ============================================================
        function renderLesson(lesson, slot, slotIndex, dayIndex, lessonIndex, currentIdx, now, isToday) {
            const tag = lesson.name.includes('платная') ? '⭐ ДОП' :
                        lesson.name.includes('кружок') ? '🎯 КРУЖОК' : '';
            const num = lessonIndex + 1;

            const isCurrent = (isToday && slotIndex === currentIdx);

            let progress = 0;
            let timeLeftStr = '';
            const timeRange = `${slot.start} – ${slot.end}`;

            if (isCurrent) {
                const total = getTimeDiff(slot.end, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0)) -
                             getTimeDiff(slot.start, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0));
                const elapsed = getTimeDiff(slot.start, now);
                if (total > 0) {
                    progress = Math.min((elapsed / total) * 100, 100);
                }
                const left = getTimeDiff(slot.end, now);
                if (left > 0) {
                    timeLeftStr = formatTimeSmart(left);
                }
            }

            const currentClass = isCurrent ? 'current-lesson' : '';
            const progressBar = isCurrent ? `<div class="lesson-progress" style="width: ${progress}%;"></div>` : '';

            return `
                <div class="lesson-item ${lesson.cls} ${currentClass}" 
                     data-day="${dayIndex}" 
                     data-lesson-index="${lessonIndex}" 
                     style="${isCurrent ? 'border-color: #22c55e !important;' : ''}">
                    ${progressBar}
                    <div class="lesson-number">${num}</div>
                    <div class="lesson-icon">${lesson.icon}</div>
                    <div class="lesson-info">
                        <div class="lesson-name">${lesson.name} ${isCurrent ? '▶️' : ''}</div>
                        ${tag ? `<div class="lesson-sub">${tag}</div>` : ''}
                    </div>
                    <div class="lesson-time">${isCurrent ? `⏳ ${timeLeftStr}` : timeRange}</div>
                </div>
            `;
        }

        // ============================================================
        // 7. ОБНОВЛЕНИЕ ДИНАМИЧЕСКИХ ЭЛЕМЕНТОВ (БЕЗ МИГАНИЙ)
        // ============================================================
        function updateDynamicElements(currentIdx, now) {
            const isToday = (currentDay === getTodayIndex());
            if (!isToday) return;

            const items = container.querySelectorAll('.lesson-item');
            let currentItemIdx = 0;

            for (let i = 0; i < bellSchedule.length; i++) {
                const slot = bellSchedule[i];
                if (slot.type === 'lunch') {
                    if (currentItemIdx < items.length) {
                        const el = items[currentItemIdx];
                        if (el.classList.contains('lunch') && i === currentIdx) {
                            const progressBar = el.querySelector('.lesson-progress');
                            if (progressBar) {
                                const total = getTimeDiff(slot.end, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0)) -
                                             getTimeDiff(slot.start, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0));
                                const elapsed = getTimeDiff(slot.start, now);
                                if (total > 0) {
                                    const progress = Math.min((elapsed / total) * 100, 100);
                                    progressBar.style.width = progress + '%';
                                }
                            }
                            const timeEl = el.querySelector('.lesson-time');
                            if (timeEl) {
                                const left = getTimeDiff(slot.end, now);
                                if (left > 0) {
                                    timeEl.textContent = `⏳ ${formatTimeSmart(left)}`;
                                } else {
                                    timeEl.textContent = '⏳ 0с';
                                }
                            }
                        }
                        currentItemIdx++;
                    }
                    continue;
                }

                if (currentItemIdx < items.length) {
                    const el = items[currentItemIdx];
                    if (i === currentIdx && !el.classList.contains('lunch')) {
                        const progressBar = el.querySelector('.lesson-progress');
                        if (progressBar) {
                            const total = getTimeDiff(slot.end, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0)) -
                                         getTimeDiff(slot.start, new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0));
                            const elapsed = getTimeDiff(slot.start, now);
                            if (total > 0) {
                                const progress = Math.min((elapsed / total) * 100, 100);
                                progressBar.style.width = progress + '%';
                            }
                        }
                        const timeEl = el.querySelector('.lesson-time');
                        if (timeEl) {
                            const left = getTimeDiff(slot.end, now);
                            if (left > 0) {
                                timeEl.textContent = `⏳ ${formatTimeSmart(left)}`;
                            } else {
                                timeEl.textContent = '⏳ 0с';
                            }
                        }
                    }
                    currentItemIdx++;
                }
            }
        }

        // ============================================================
        // 8. ДАННЫЕ ДЛЯ ВЫХОДНЫХ
        // ============================================================
        function getWeekendData(dayIndex) {
            if (dayIndex === 5) {
                return {
                    emoji: '🎉',
                    title: 'Йухууу! Суббота!',
                    sub: 'Отдыхай, гуляй, делай что хочешь! Уроки подождут до понедельника.'
                };
            } else {
                return {
                    emoji: '😴',
                    title: 'Воскресенье... Спокойствие...',
                    sub: 'Заряжайся энергией на новую неделю! Или просто спи, мы не судим.'
                };
            }
        }

        // ============================================================
        // 9. ПЕРЕКЛЮЧЕНИЕ ДНЕЙ
        // ============================================================
        const dayBtns = document.querySelectorAll('.day-btn');

        function setDay(index) {
            currentDay = index;
            dayBtns.forEach((btn, i) => btn.classList.toggle('active', i === index));
            renderedDay = -1;
            renderSchedule();
            const today = new Date().getDay();
            const weekdays = [1,2,3,4,5,6,0];
            document.getElementById('todayBadge').textContent =
                weekdays[today] === index ? '📅 СЕГОДНЯ' : '📅 ' + days[index].name;
        }

        dayBtns.forEach((btn, i) => btn.addEventListener('click', () => setDay(i)));

        const todayIndex = getTodayIndex();
        // Если сегодня суббота (5) или воскресенье (6) — показываем их
        setDay(todayIndex >= 0 && todayIndex <= 6 ? todayIndex : 0);

        // ============================================================
        // 10. СВАЙП (горизонтальный)
        // ============================================================
        let touchStartX = 0;
        let touchStartY = 0;
        let isSwiping = false;

        container.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 20) {
                isSwiping = false;
            }
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
            if (!isSwiping) {
                isSwiping = false;
                return;
            }
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 40) {
                if (dx > 0 && currentDay > 0) setDay(currentDay - 1);
                else if (dx < 0 && currentDay < 6) setDay(currentDay + 1);
            }
            isSwiping = false;
        }, { passive: true });

        // ============================================================
        // 11. ТЕМА
        // ============================================================
        const themeBtn = document.getElementById('themeToggle');
        let isLight = true;

        try {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                isLight = false;
                document.body.className = 'dark';
                themeBtn.textContent = '☀️ Светлая';
            } else {
                document.body.className = 'light';
                themeBtn.textContent = '🌙 Тёмная';
            }
        } catch(e) {}

        themeBtn.addEventListener('click', () => {
            isLight = !isLight;
            document.body.className = isLight ? 'light' : 'dark';
            themeBtn.textContent = isLight ? '🌙 Тёмная' : '☀️ Светлая';
            try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch(e) {}
        });

        // ============================================================
        // 12. ПОЛНЫЙ ЭКРАН
        // ============================================================
        const fsBtn = document.getElementById('fullscreenToggle');

        function updateFullscreenButton() {
            fsBtn.textContent = document.fullscreenElement ? '⛶ Сжать' : '⛶ На весь';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateFullscreenButton();
        });

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', updateFullscreenButton);

        // ============================================================
        // 13. ПОДЕЛИТЬСЯ
        // ============================================================
        document.getElementById('shareBtn').addEventListener('click', () => {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: 'Расписание 2Б',
                    text: 'Расписание 2Б класса — смотри и не опаздывай!',
                    url: url
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    const tipText = document.querySelector('.tooltip-box .text');
                    const oldText = tipText.innerHTML;
                    tipText.innerHTML = '✅ Ссылка скопирована! Отправь её друзьям.';
                    setTimeout(() => { tipText.innerHTML = oldText; }, 2500);
                }).catch(() => {
                    prompt('Скопируй ссылку:', url);
                });
            }
        });

        // ============================================================
        // 14. ПОГОДА
        // ============================================================
        async function fetchWeather() {
            const weatherEl = document.getElementById('weatherDisplay');
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=57.15&longitude=65.53&current_weather=true&timezone=Asia/Yekaterinburg');
                if (!res.ok) throw new Error('Ошибка сети');
                const data = await res.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                let emoji = '🌤️';
                let desc = 'ясно';
                if (code === 0) { emoji = '☀️'; desc = 'ясно'; }
                else if (code >= 1 && code <= 3) { emoji = '⛅'; desc = 'облачно'; }
                else if (code >= 51 && code <= 67) { emoji = '🌧️'; desc = 'дождь'; }
                else if (code >= 71 && code <= 77) { emoji = '❄️'; desc = 'снег'; }
                else if (code >= 80 && code <= 99) { emoji = '⛈️'; desc = 'гроза'; }
                weatherEl.textContent = `${emoji} Тюмень: ${desc}, ${temp}°C`;
            } catch (e) {
                weatherEl.textContent = '🌤️ Тюмень: --°C';
            }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // ============================================================
        // 15. ЗАПУСК ОБНОВЛЕНИЙ
        // ============================================================
        setInterval(() => {
            renderSchedule();
        }, 1000);

        // ============================================================
        // 16. PULL-TO-REFRESH
        // ============================================================
        let pullStartY2 = 0;
        let pullOffset2 = 0;
        const pullIndicator = document.getElementById('pullIndicator');
        let isPullActive = false;

        document.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                pullStartY2 = e.touches[0].clientY;
                isPullActive = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (!isPullActive || window.scrollY > 0) return;
            const delta = e.touches[0].clientY - pullStartY2;
            if (delta > 20) {
                pullIndicator.classList.add('show');
                pullIndicator.textContent = '⬇️ Отпусти, чтобы обновить';
                pullOffset2 = delta;
            } else {
                pullIndicator.textContent = '⬇️ Потяни, чтобы обновить';
                pullOffset2 = 0;
            }
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (pullOffset2 > 30) {
                pullIndicator.textContent = '🔄 Обновляем...';
                setTimeout(() => {
                    window.location.reload();
                }, 300);
            } else {
                pullIndicator.classList.remove('show');
                pullIndicator.textContent = '⬇️ Потяни, чтобы обновить';
            }
            pullStartY2 = 0;
            pullOffset2 = 0;
            isPullActive = false;
        }, { passive: true });

        // ============================================================
        // 17. ЭКСПОРТ В PDF
        // ============================================================
        document.getElementById('exportPdf').addEventListener('click', function() {
            // Создаём временный контейнер для всего расписания
            const fullSchedule = document.createElement('div');
            fullSchedule.style.padding = '20px';
            fullSchedule.style.fontFamily = "'Segoe UI', system-ui, sans-serif";
            fullSchedule.style.color = '#0f172a';
            fullSchedule.style.background = '#ffffff';

            // Шапка
            const header = document.createElement('div');
            header.style.textAlign = 'center';
            header.style.marginBottom = '20px';
            header.style.borderBottom = '3px solid #fbbf24';
            header.style.paddingBottom = '10px';
            header.innerHTML = `
                <h1 style="font-size: 24px; font-weight: 900; color: #0f172a;">📚 РАСПИСАНИЕ 2Б НА НЕДЕЛЮ</h1>
                <p style="font-size: 14px; color: #64748b;">Тюмень, ${new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                <p style="font-size: 12px; color: #94a3b8;">Лучшие практики — лучшие результаты! 🚀</p>
            `;
            fullSchedule.appendChild(header);

            // Проходим по всем дням
            for (let d = 0; d < days.length; d++) {
                const day = days[d];
                const dayDiv = document.createElement('div');
                dayDiv.style.marginBottom = '20px';
                dayDiv.style.border = '1px solid #e2e8f0';
                dayDiv.style.borderRadius = '12px';
                dayDiv.style.padding = '15px';
                dayDiv.style.background = d % 2 === 0 ? '#f8fafc' : '#ffffff';

                const dayTitle = document.createElement('div');
                dayTitle.style.fontSize = '18px';
                dayTitle.style.fontWeight = '700';
                dayTitle.style.marginBottom = '10px';
                dayTitle.style.color = '#0f172a';
                dayTitle.innerHTML = day.isWeekend ? `🎉 ${day.name}` : `📅 ${day.name}`;
                dayDiv.appendChild(dayTitle);

                if (day.isWeekend) {
                    const weekendMsg = document.createElement('div');
                    weekendMsg.style.textAlign = 'center';
                    weekendMsg.style.fontSize = '24px';
                    weekendMsg.style.padding = '20px';
                    weekendMsg.style.color = '#94a3b8';
                    weekendMsg.innerHTML = day.name.includes('СУББОТА') ? '🎉 Выходной! Отдыхаем и кайфуем! 🎉' : '😴 Выходной! Набираемся сил! 😴';
                    dayDiv.appendChild(weekendMsg);
                    fullSchedule.appendChild(dayDiv);
                    continue;
                }

                if (day.lessons.length === 0) {
                    const noLessons = document.createElement('div');
                    noLessons.style.textAlign = 'center';
                    noLessons.style.padding = '10px';
                    noLessons.style.color = '#94a3b8';
                    noLessons.innerHTML = 'Нет уроков';
                    dayDiv.appendChild(noLessons);
                    fullSchedule.appendChild(dayDiv);
                    continue;
                }

                // До обеда
                const beforeDiv = document.createElement('div');
                beforeDiv.style.marginBottom = '8px';
                beforeDiv.style.fontSize = '12px';
                beforeDiv.style.fontWeight = '600';
                beforeDiv.style.color = '#64748b';
                beforeDiv.textContent = '🍳 До обеда';
                dayDiv.appendChild(beforeDiv);

                let lessonCount = 0;
                for (let i = 0; i < 3 && lessonCount < day.lessons.length; i++) {
                    const lesson = day.lessons[lessonCount];
                    const slot = bellSchedule[i];
                    if (slot.type === 'lunch') continue;
                    const lessonRow = document.createElement('div');
                    lessonRow.style.display = 'flex';
                    lessonRow.style.justifyContent = 'space-between';
                    lessonRow.style.padding = '4px 0';
                    lessonRow.style.borderBottom = '1px solid #e2e8f0';
                    lessonRow.style.fontSize = '13px';
                    lessonRow.innerHTML = `
                        <span><strong>${lessonCount+1}.</strong> ${lesson.icon} ${lesson.name}</span>
                        <span style="color: #64748b;">${slot.start} – ${slot.end}</span>
                    `;
                    dayDiv.appendChild(lessonRow);
                    lessonCount++;
                }

                // Обед
                const lunchSlot = bellSchedule.find(s => s.type === 'lunch');
                if (lunchSlot) {
                    const lunchDiv = document.createElement('div');
                    lunchDiv.style.margin = '8px 0';
                    lunchDiv.style.padding = '6px 10px';
                    lunchDiv.style.background = '#fef3c7';
                    lunchDiv.style.borderRadius = '8px';
                    lunchDiv.style.fontSize = '13px';
                    lunchDiv.style.fontWeight = '600';
                    lunchDiv.style.color = '#92400e';
                    lunchDiv.innerHTML = `🍔 Обед (${lunchSlot.start} – ${lunchSlot.end})`;
                    dayDiv.appendChild(lunchDiv);
                }

                // После обеда
                const afterDiv = document.createElement('div');
                afterDiv.style.marginTop = '8px';
                afterDiv.style.marginBottom = '8px';
                afterDiv.style.fontSize = '12px';
                afterDiv.style.fontWeight = '600';
                afterDiv.style.color = '#64748b';
                afterDiv.textContent = '🌙 После обеда';
                dayDiv.appendChild(afterDiv);

                for (let i = 4; i < bellSchedule.length && lessonCount < day.lessons.length; i++) {
                    const lesson = day.lessons[lessonCount];
                    const slot = bellSchedule[i];
                    if (slot.type === 'lunch') continue;
                    const lessonRow = document.createElement('div');
                    lessonRow.style.display = 'flex';
                    lessonRow.style.justifyContent = 'space-between';
                    lessonRow.style.padding = '4px 0';
                    lessonRow.style.borderBottom = '1px solid #e2e8f0';
                    lessonRow.style.fontSize = '13px';
                    lessonRow.innerHTML = `
                        <span><strong>${lessonCount+1}.</strong> ${lesson.icon} ${lesson.name}</span>
                        <span style="color: #64748b;">${slot.start} – ${slot.end}</span>
                    `;
                    dayDiv.appendChild(lessonRow);
                    lessonCount++;
                }

                fullSchedule.appendChild(dayDiv);
            }

            // Подвал
            const footer = document.createElement('div');
            footer.style.textAlign = 'center';
            footer.style.marginTop = '20px';
            footer.style.paddingTop = '10px';
            footer.style.borderTop = '2px solid #fbbf24';
            footer.style.fontSize = '12px';
            footer.style.color = '#94a3b8';
            footer.innerHTML = '✨ Сделано с любовью для 2Б класса! ✨<br>Не опаздывай на уроки! 🚀';
            fullSchedule.appendChild(footer);

            // Вставляем в контейнер для PDF
            const tempContainer = document.createElement('div');
            tempContainer.appendChild(fullSchedule);
            document.body.appendChild(tempContainer);

            const opt = {
                margin:        [10, 10, 10, 10],
                filename:     'raspisanie-2b-na-nedelyu.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(tempContainer).save().then(() => {
                document.body.removeChild(tempContainer);
            });
        });
    </script>
</body>
</html>
