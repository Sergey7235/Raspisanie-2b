<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2Б Расписание</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px 12px 30px;
            min-height: 100vh;
            transition: background 0.5s, color 0.5s;
            background: #f0f9ff;
            color: #1e293b;
            position: relative;
            overflow-x: hidden;
        }

        /* --- ОБЛАКА И СОЛНЦЕ (только для светлой темы) --- */
        body.light {
            background: linear-gradient(180deg, #bae6fd 0%, #f0f9ff 50%, #ffffff 100%);
        }
        body.light::before {
            content: '☀️';
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 4.5rem;
            filter: drop-shadow(0 0 30px #fbbf24);
            animation: spin 20s linear infinite;
            z-index: 0;
            opacity: 0.7;
            pointer-events: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .cloud {
            position: fixed;
            font-size: 3.5rem;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: floatCloud 25s ease-in-out infinite alternate;
        }
        .cloud1 { top: 8%; left: -5%; animation-duration: 28s; }
        .cloud2 { top: 25%; right: -3%; animation-duration: 32s; animation-delay: 3s; }
        .cloud3 { bottom: 12%; left: 5%; animation-duration: 35s; animation-delay: 6s; font-size: 4rem; }
        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(120px); }
        }

        /* тёмная тема — без облаков, но с нормальным фоном */
        body.dark {
            background: #0f172a;
            color: #f1f5f9;
        }
        body.dark::before { display: none; }
        body.dark .cloud { display: none; }

        /* --- ПАНЕЛЬ УПРАВЛЕНИЯ --- */
        .control-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }
        .control-btn {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        body.dark .control-btn {
            background: rgba(255,255,255,0.08);
            color: #f1f5f9;
        }
        .control-btn:hover { transform: scale(1.03); }
        .control-btn:active { transform: scale(0.94); }

        /* --- ШАПКА --- */
        .header {
            text-align: center;
            padding: 20px 0 12px;
            border-bottom: 3px dashed #fbbf24;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, #f97316, #eab308, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        body.dark .header h1 {
            background: linear-gradient(45deg, #38bdf8, #fbbf24, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }
        body.dark .header p { color: #94a3b8; }
        .today-badge {
            display: inline-block;
            background: #f43f5e;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 6px;
            color: #fff;
            box-shadow: 0 2px 12px rgba(244, 63, 94, 0.3);
        }

        /* --- ДНИ --- */
        .day-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none;
            position: relative;
            z-index: 2;
        }
        .day-tabs::-webkit-scrollbar { display: none; }
        .day-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: 40px;
            border: none;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            color: #475569;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        body.dark .day-btn {
            background: #1e293b;
            color: #94a3b8;
        }
        .day-btn.active {
            background: #fbbf24;
            color: #0f172a;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        }
        .day-btn:active { transform: scale(0.94); }

        /* --- КАРТОЧКИ УРОКОВ --- */
        .schedule-card {
            display: none;
            position: relative;
            z-index: 2;
        }
        .schedule-card.active { display: block; }

        .lesson-item {
            border-radius: 20px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 8px solid #fbbf24;
            transition: 0.2s;
            cursor: pointer;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            opacity: 0;
            transform: translateX(-30px);
            animation: popIn 0.4s ease forwards;
        }
        body.dark .lesson-item {
            background: #1e293b;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .lesson-item:active { transform: scale(0.97); background: rgba(255,255,255,0.95); }
        body.dark .lesson-item:active { background: #2d3a4f; }

        @keyframes popIn {
            0% { opacity: 0; transform: translateX(-30px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        /* задержки для каждого урока */
        .lesson-item:nth-child(1) { animation-delay: 0.05s; }
        .lesson-item:nth-child(2) { animation-delay: 0.12s; }
        .lesson-item:nth-child(3) { animation-delay: 0.19s; }
        .lesson-item:nth-child(4) { animation-delay: 0.26s; }
        .lesson-item:nth-child(5) { animation-delay: 0.33s; }
        .lesson-item:nth-child(6) { animation-delay: 0.40s; }
        .lesson-item:nth-child(7) { animation-delay: 0.47s; }
        .lesson-item:nth-child(8) { animation-delay: 0.54s; }

        .lesson-number {
            background: #e2e8f0;
            color: #475569;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        body.dark .lesson-number {
            background: #334155;
            color: #cbd5e1;
        }
        .lesson-icon { font-size: 1.8rem; width: 44px; text-align: center; flex-shrink: 0; }
        .lesson-info { flex: 1; }
        .lesson-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3px; }
        .lesson-sub { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; font-weight: 500; }

        /* --- ПОДСКАЗКА --- */
        .tooltip-box {
            margin-top: 20px;
            border-radius: 20px;
            padding: 18px 20px;
            border-left: 8px solid #f43f5e;
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 70px;
            transition: 0.3s;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            color: #1e293b;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            position: relative;
            z-index: 2;
        }
        body.dark .tooltip-box {
            background: #1e293b;
            color: #cbd5e1;
        }
        .tooltip-box span { color: #fbbf24; font-weight: 700; }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #94a3b8;
            font-size: 0.7rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }
        body.dark .footer { color: #475569; }

        /* ЦВЕТА БОРДЕРОВ (светлая тема) */
        .math { border-color: #f87171; }
        .rus { border-color: #60a5fa; }
        .lit { border-color: #fbbf24; }
        .eng { border-color: #34d399; }
        .world { border-color: #6ee7b7; }
        .phys { border-color: #f472b6; }
        .music { border-color: #a78bfa; }
        .izo { border-color: #f472b6; }
        .tech { border-color: #fb923c; }
        .sense { border-color: #22d3ee; }
        .talk { border-color: #f87171; }
        .extra { border-color: #fbbf24; }
        .circle { border-color: #e879f9; }

        /* тёмная тема — насыщенные бордеры */
        body.dark .math { border-color: #f87171; }
        body.dark .rus { border-color: #60a5fa; }
        body.dark .lit { border-color: #fbbf24; }
        body.dark .eng { border-color: #34d399; }
        body.dark .world { border-color: #6ee7b7; }
        body.dark .phys { border-color: #f472b6; }
        body.dark .music { border-color: #a78bfa; }
        body.dark .izo { border-color: #f472b6; }
        body.dark .tech { border-color: #fb923c; }
        body.dark .sense { border-color: #22d3ee; }
        body.dark .talk { border-color: #f87171; }
        body.dark .extra { border-color: #fbbf24; }
        body.dark .circle { border-color: #e879f9; }
    </style>
</head>
<body class="light">

    <!-- ОБЛАЧКИ (только для светлой темы) -->
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>

    <div class="control-bar">
        <button class="control-btn" id="themeToggle">🌙 Тёмная</button>
        <button class="control-btn" id="fullscreenToggle">⛶ Сжать</button>
    </div>

    <div class="header">
        <h1>🌟 2Б РАСПИСАНИЕ</h1>
        <p>Учись и улыбайся!</p>
        <div class="today-badge" id="todayBadge">📅 СЕГОДНЯ</div>
    </div>

    <div class="day-tabs" id="dayTabs">
        <button class="day-btn active" data-day="0">ПН</button>
        <button class="day-btn" data-day="1">ВТ</button>
        <button class="day-btn" data-day="2">СР</button>
        <button class="day-btn" data-day="3">ЧТ</button>
        <button class="day-btn" data-day="4">ПТ</button>
    </div>

    <div id="scheduleContainer"></div>

    <div class="tooltip-box" id="tooltip">
        <span>👆</span> Нажми на урок — узнаешь секрет!
    </div>

    <div class="footer">✨ Удачи, 2Б! Ты справишься! ✨</div>

    <script>
        // ============ ДАННЫЕ ============
        const days = [{
            name: 'ПОНЕДЕЛЬНИК',
            lessons: [
                { name: 'Занимательная математика (кружок)', icon: '🧮', cls: 'circle', tip: 'Играем в числа! Будет весело, как в квесте.' },
                { name: 'Разговоры о важном', icon: '🗣️', cls: 'talk', tip: 'Говорим о дружбе и мечтах. Можно даже пофантазировать!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Чертим фигуры и считаем. Ты сможешь!' },
                { name: 'Английский язык', icon: '🇬🇧', cls: 'eng', tip: 'Новые слова! Повторяй за учителем — будет классно.' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Пишем красиво и грамотно. Ты почти писатель!' },
                { name: 'Музыка', icon: '🎵', cls: 'music', tip: 'Поём и танцуем! Даже если не в ритм — главное радость.' }
            ]
        }, {
            name: 'ВТОРНИК',
            lessons: [
                { name: 'Физическая культура', icon: '🏃', cls: 'phys', tip: 'Бегай, прыгай, играй! Не забудь воду и форму.' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Читаем сказки. Представь, что ты герой книги!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Учим таблицу умножения. Это как магия чисел!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Разбираем слова. Ты уже почти эксперт!' },
                { name: 'Окружающий мир', icon: '🌍', cls: 'world', tip: 'Узнаём о животных. Кто живёт в лесу?' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Решаем сложные задачки. Ты же умник!' }
            ]
        }, {
            name: 'СРЕДА',
            lessons: [
                { name: 'Английский язык', icon: '🇬🇧', cls: 'eng', tip: 'Учим слова про еду и игры. Yummy!' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Ищем неизвестное, как сыщики.' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Падежи — не страшно. Повторим и запомним.' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Читаем стихи. Попробуй прочитать с выражением!' },
                { name: 'ИЗО', icon: '🎨', cls: 'izo', tip: 'Рисуй что хочешь. Даже если не похоже — это искусство!' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Логические задачки — для настоящих гениев.' }
            ]
        }, {
            name: 'ЧЕТВЕРГ',
            lessons: [
                { name: 'Окружающий мир', icon: '🌍', cls: 'world', tip: 'Планета Земля — наш дом. Береги её!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Сочиняем историю. Кто твой главный герой?' },
                { name: 'Физическая культура', icon: '🏃', cls: 'phys', tip: 'Спортивные игры — лови мяч и беги!' },
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Сказки разных народов. Узнай новое!' },
                { name: 'Технология', icon: '🔧', cls: 'tech', tip: 'Лепим, клеим, мастерим. Твори как художник!' }
            ]
        }, {
            name: 'ПЯТНИЦА',
            lessons: [
                { name: 'Литературное чтение', icon: '📖', cls: 'lit', tip: 'Дочитываем книгу до конца. Как тебе финал?' },
                { name: 'Математика', icon: '📐', cls: 'math', tip: 'Решай спокойно. Ты всё знаешь!' },
                { name: 'Русский язык', icon: '✍️', cls: 'rus', tip: 'Глаголы — наши друзья. Пиши уверенно.' },
                { name: 'Смысловое чтение', icon: '🤔', cls: 'sense', tip: 'Читай и думай. Задавай вопросы — это круто!' },
                { name: 'Дополнительная математика (платная)', icon: '💰', cls: 'extra', tip: 'Финальная битва с задачками. Ты победишь!' }
            ]
        }];

        // ============ ПОДСКАЗКИ ============
        const tipMap = {};
        days.forEach((d, di) => {
            d.lessons.forEach((l, li) => {
                tipMap[di + '-' + li] = l.tip;
            });
        });

        // ============ ОТРИСОВКА ДНЯ ============
        const container = document.getElementById('scheduleContainer');
        function renderDay(index) {
            const day = days[index];
            let html = `<div class="schedule-card active">`;
            day.lessons.forEach((lesson, i) => {
                const tag = lesson.name.includes('платная') ? '⭐ ДОП' :
                            lesson.name.includes('кружок') ? '🎯 КРУЖОК' : '';
                const num = i + 1;
                html += `
                    <div class="lesson-item ${lesson.cls}" data-day="${index}" data-idx="${i}">
                        <div class="lesson-number">${num}</div>
                        <div class="lesson-icon">${lesson.icon}</div>
                        <div class="lesson-info">
                            <div class="lesson-name">${lesson.name}</div>
                            ${tag ? `<div class="lesson-sub">${tag}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            document.querySelectorAll('.lesson-item').forEach(el => {
                el.addEventListener('click', function() {
                    const day = parseInt(this.dataset.day);
                    const idx = parseInt(this.dataset.idx);
                    const tip = tipMap[day + '-' + idx] || 'Будь молодцом!';
                    const name = days[day].lessons[idx].name;
                    document.getElementById('tooltip').innerHTML = `
                        <span>💡</span> <strong>${name}</strong> — ${tip}
                    `;
                });
            });
        }

        // ============ ПЕРЕКЛЮЧЕНИЕ ДНЕЙ ============
        const dayBtns = document.querySelectorAll('.day-btn');
        let currentDay = 0;

        function setDay(index) {
            currentDay = index;
            dayBtns.forEach((btn, i) => btn.classList.toggle('active', i === index));
            renderDay(index);
            const today = new Date().getDay();
            const weekdays = [1,2,3,4,5,6,0];
            document.getElementById('todayBadge').textContent =
                weekdays[today] === index ? '📅 СЕГОДНЯ' : '📅 ' + days[index].name;
        }

        dayBtns.forEach((btn, i) => btn.addEventListener('click', () => setDay(i)));

        // ============ АВТО-ВЫБОР ДНЯ ============
        const today = new Date().getDay();
        const weekdays = [1,2,3,4,5,6,0];
        let todayIndex = weekdays.indexOf(today);
        if (todayIndex === -1 || todayIndex > 4) todayIndex = 0;
        setDay(todayIndex);

        // ============ СВАЙП ============
        let startX = 0;
        container.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
        container.addEventListener('touchend', (e) => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0 && currentDay < 4) setDay(currentDay + 1);
                else if (diff < 0 && currentDay > 0) setDay(currentDay - 1);
            }
        });

        // ============ ТЕМА ============
        const themeBtn = document.getElementById('themeToggle');
        let isLight = true;

        themeBtn.addEventListener('click', () => {
            isLight = !isLight;
            document.body.className = isLight ? 'light' : 'dark';
            themeBtn.textContent = isLight ? '🌙 Тёмная' : '☀️ Светлая';
            try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch(e) {}
        });
        try {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                isLight = false;
                document.body.className = 'dark';
                themeBtn.textContent = '☀️ Светлая';
            }
        } catch(e) {}

        // ============ ПОЛНЫЙ ЭКРАН ПО УМОЛЧАНИЮ ============
        const fsBtn = document.getElementById('fullscreenToggle');

        // пробуем включить сразу при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            fsBtn.textContent = document.fullscreenElement ? '⛶ Сжать' : '⛶ На весь';
        });
    </script>
</body>
</html>
